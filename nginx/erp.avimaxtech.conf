upstream erpnext_upstream {
    server 127.0.0.1:8085;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name erp.avimaxtech.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://erp.avimaxtech.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name erp.avimaxtech.com;

    ssl_certificate /etc/ssl/certs/avimax.crt;
    ssl_certificate_key /etc/ssl/private/avimax.key;

    client_max_body_size 50M;

    location / {
        proxy_pass http://erpnext_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }
}
